name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  general-tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04, macos-15-intel, windows-2022, ubuntu-26.04-arm, macos-15, windows-11-arm ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install lld (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build
        run: cmake --workflow --preset build-release

      - name: Test
        run: ctest --preset release
  
  docker-tests:
      timeout-minutes: 10
      runs-on: ubuntu-26.04
      defaults:
        run:
          shell: bash
      steps:
        - name: Checkout
          uses: actions/checkout@v7
          with:
            fetch-depth: 0
            fetch-tags: true

        - name: Build
          run: cmake --workflow --preset build-release

        - name: Run tests
          run: bash test/portability/test-all.bash
