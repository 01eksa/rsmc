name: Build Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            ext: tar.gz
          - os: windows-latest
            label: windows-x64
            ext: zip
          - os: macos-latest
            label: macos-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install into package directory
        run: cmake --install build --config Release --prefix install

      - name: Archive package (tar.gz)
        if: matrix.ext == 'tar.gz'
        working-directory: install
        run: tar czvf ../rsmc-${{ matrix.label }}-${{ github.ref_name }}.tar.gz .

      - name: Archive package (zip)
        if: matrix.ext == 'zip'
        working-directory: install
        run: cmake -E tar cfv ../rsmc-${{ matrix.label }}-${{ github.ref_name }}.zip --format=zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsmc-${{ matrix.label }}
          path: rsmc-${{ matrix.label }}-${{ github.ref_name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rsmc-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
