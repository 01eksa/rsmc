name: Build Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name of the existing release (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build-x64:
    strategy:
      fail-fast: false
      matrix:
        arch: 
          - name: x86-64
            label: x64
          - name: x86-64-v3
            label: x64-v3

        target:
          - os: ubuntu-22.04
            label: linux
            pack-method: tgz
          - os: macos-15-intel
            label: osx
            pack-method: tgz
          - os: windows-2022
            label: win
            pack-method: zip
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ matrix.target.label }}-${{ matrix.arch.label }}
      POSTFIX: ${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target.label }}-${{ matrix.arch.label }}.${{ matrix.target.ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: CFLAGS="-march=${{ matrix.arch.name }}" cmake --workflow --preset build-release

      - name: Test
        run: ctest --preset release

      - name: Pack
        run: cpack --preset release-${{ matrix.target.pack-method }}
      
      - name: Make directory for packages
        run: mkdir dist

      - name: Move package (tar.gz)
        if: matrix.target.pack-method == 'tgz'
        run: mv build/release/*.tar.gz dist/rsmc-${{ env.POSTFIX }}

      - name: Move package (zip)
        if: matrix.target.pack-method == 'zip'
        run: mv build/release/*.zip dist/rsmc-${{ env.POSTFIX }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsmc-${{ env.LABEL }}
          path: rsmc-${{ env.POSTFIX }}

  build-arm64:
    strategy:
      fail-fast: false
      matrix:
        arch: 
          - name: armv8-a 
            label: arm64
        target:
          - os: ubuntu-22.04-arm
            label: linux
            pack-method: tgz
          - os: macos-15
            label: osx
            pack-method: tgz
          - os: windows-11-arm
            label: win
            pack-method: zip
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_PATH: build-${{ matrix.arch }}
      LABEL: ${{ matrix.target.label }}-${{ matrix.arch }}
      POSTFIX: ${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target.label }}-${{ matrix.arch }}.${{ matrix.target.ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: CFLAGS="-march=${{ matrix.arch.name }}" cmake --workflow --preset build-release

      - name: Test
        run: ctest --preset release

      - name: Pack
        run: cpack --preset release-${{ matrix.target.pack-method }}
      
      - name: Make directory for packages
        run: mkdir dist

      - name: Move package (tar.gz)
        if: matrix.target.pack-method == 'tgz'
        run: mv build/release/*.tar.gz dist/rsmc-${{ env.POSTFIX }}

      - name: Move package (zip)
        if: matrix.target.pack-method == 'zip'
        run: mv build/release/*.zip dist/rsmc-${{ env.POSTFIX }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsmc-${{ env.LABEL }}
          path: rsmc-${{ env.POSTFIX }}

  docs:
    needs: [ build-x64, build-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html

  deploy-docs:
    needs: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [ build-x64, build-arm64, deploy-docs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rsmc-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
