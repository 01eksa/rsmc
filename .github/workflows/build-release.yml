name: Build Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name of the existing release (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  build-x64:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86-64, x86-64-v3 ]
        target:
          - os: ubuntu-22.04
            label: linux
            ext: tar.gz
          - os: macos-15-intel
            label: macos
            ext: tar.gz
          - os: windows-2022
            label: windows
            ext: zip
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_PATH: build-${{ matrix.arch }}
      LABEL: ${{ matrix.target.label }}-${{ matrix.arch }}
      POSTFIX: ${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target.label }}-${{ matrix.arch }}.${{ matrix.target.ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B ${{ env.BUILD_PATH }} -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-O3 -march=${{ matrix.arch }}"

      - name: Build
        run: cmake --build ${{ env.BUILD_PATH }} --config Release

      - name: Test
        run: ctest --test-dir ${{ env.BUILD_PATH }} -C Release

      - name: Install
        run: cmake --install ${{ env.BUILD_PATH }} --config Release --prefix install

      - name: Archive package (tar.gz)
        if: matrix.target.ext == 'tar.gz'
        working-directory: install
        run: tar czvf ../rsmc-${{ env.POSTFIX }} .

      - name: Archive package (zip)
        if: matrix.target.ext == 'zip'
        working-directory: install
        run: cmake -E tar cfv ../rsmc-${{ env.POSTFIX }} --format=zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsmc-${{ env.LABEL }}
          path: rsmc-${{ env.POSTFIX }}

  build-arm64:
    strategy:
      fail-fast: false
      matrix:
        arch: [ armv8-a ]
        target:
          - os: ubuntu-22.04-arm
            label: linux-arm64
            ext: tar.gz
          - os: macos-15
            label: macos-arm64
            ext: tar.gz
          - os: windows-11-arm
            label: windows-arm64
            ext: zip
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_PATH: build-${{ matrix.arch }}
      LABEL: ${{ matrix.target.label }}-${{ matrix.arch }}
      POSTFIX: ${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target.label }}-${{ matrix.arch }}.${{ matrix.target.ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B ${{ env.BUILD_PATH }} -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-O3 -march=${{ matrix.arch }}" -G Ninja

      - name: Build
        run: ninja -C ${{ env.BUILD_PATH }} -v

      - name: Test
        run: ctest --test-dir ${{ env.BUILD_PATH }} -C Release

      - name: Install
        run: cmake --install ${{ env.BUILD_PATH }} --config Release --prefix install

      - name: Archive package (tar.gz)
        if: matrix.target.ext == 'tar.gz'
        working-directory: install
        run: tar czvf ../rsmc-${{ env.POSTFIX }} .

      - name: Archive package (zip)
        if: matrix.target.ext == 'zip'
        working-directory: install
        run: cmake -E tar cfv ../rsmc-${{ env.POSTFIX }} --format=zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsmc-${{ env.LABEL }}
          path: rsmc-${{ env.POSTFIX }}

  docs:
    needs: [ build-x64, build-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html

  deploy-docs:
    needs: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [ build-x64, build-arm64, deploy-docs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rsmc-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
